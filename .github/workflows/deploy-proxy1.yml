name: Build & Deploy to AWS proxy-1

on:
  workflow_dispatch:
    inputs:
      build_tags:
        description: "Go build tags for sing-box"
        required: false
        default: "with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api,badlinkname,tfogo_checklinkname0"
        type: string
      skip_deploy:
        description: "Only run build & E2E traffic-map verification without deploying to VPS"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - testing
    paths:
      - ".github/workflows/deploy-proxy1.yml"
      - "cmd/**"
      - "protocol/**"
      - "option/**"
      - "common/**"
      - "route/**"
      - "experimental/**"
      - "transport/**"
      - "go.mod"
      - "go.sum"

concurrency:
  group: deploy-proxy1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build, Verify Traffic Map & Deploy to proxy-1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Traffic Map Unit Tests
        run: |
          go test -v ./experimental/clashapi -run TestTrafficMapStateAndRealIPCapture

      - name: Build sing-box (linux/amd64)
        env:
          INPUT_TAGS: ${{ inputs.build_tags }}
        run: |
          set -euo pipefail
          TAGS="${INPUT_TAGS:-with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api,badlinkname,tfogo_checklinkname0}"
          VERSION=$(go run ./cmd/internal/read_tag || git rev-parse --short HEAD)
          LDFLAGS_SHARED=$(cat release/LDFLAGS)
          echo "Building sing-box version=${VERSION} with tags=${TAGS}"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -v -trimpath \
            -tags "${TAGS}" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${VERSION}' ${LDFLAGS_SHARED} -s -w -buildid=" \
            -o sing-box ./cmd/sing-box
          ./sing-box version

      - name: E2E Smoke Test (Verify Real Destination IP & GeoIP Map API)
        run: |
          set -euo pipefail
          cat > /tmp/test-config.json << 'EOF'
          {
            "log": { "level": "info" },
            "inbounds": [
              {
                "type": "socks",
                "tag": "socks-in",
                "listen": "127.0.0.1",
                "listen_port": 10808
              }
            ],
            "outbounds": [
              { "type": "direct", "tag": "direct" }
            ],
            "experimental": {
              "clash_api": {
                "external_controller": "127.0.0.1:19090",
                "secret": "ci-test-secret"
              }
            }
          }
          EOF

          ./sing-box check -c /tmp/test-config.json
          ./sing-box run -c /tmp/test-config.json &
          SB_PID=$!
          trap "kill ${SB_PID} 2>/dev/null || true" EXIT
          sleep 2

          echo "1. Checking /map HTML UI..."
          curl -fsSL http://127.0.0.1:19090/map | grep -q "sing-box 全球流量轨迹雷达"

          echo "2. Sending real HTTPS request to www.google.com via sing-box proxy..."
          curl -fsSL -x socks5h://127.0.0.1:10808 https://www.google.com -o /dev/null

          sleep 2
          echo "3. Querying /map/api/state to verify final destination IP capture..."
          STATE_JSON=$(curl -fsSL -H "Authorization: Bearer ci-test-secret" "http://127.0.0.1:19090/map/api/state")
          echo "${STATE_JSON}" | jq .

          DEST_IP=$(echo "${STATE_JSON}" | jq -r '.connections[] | select(.host == "www.google.com") | .destIP' | head -n1)
          if [ -z "${DEST_IP}" ] || [ "${DEST_IP}" = "null" ]; then
            echo "ERROR: Expected real final IP for www.google.com, got empty!"
            exit 1
          fi
          echo "SUCCESS: Captured www.google.com real final server IP: ${DEST_IP}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-linux-amd64
          path: sing-box
          retention-days: 14

      - name: Deploy to AWS Lightsail proxy-1 via SSH
        if: ${{ !inputs.skip_deploy }}
        env:
          SSH_HOST: ${{ secrets.PROXY1_HOST }}
          SSH_USER: ${{ secrets.PROXY1_USER }}
          SSH_KEY: ${{ secrets.PROXY1_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${SSH_KEY}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${SSH_HOST}" >> ~/.ssh/known_hosts 2>/dev/null

          scp -i ~/.ssh/id_deploy sing-box "${SSH_USER}@${SSH_HOST}:/tmp/sing-box"
          ssh -i ~/.ssh/id_deploy "${SSH_USER}@${SSH_HOST}" "sudo install -m 755 /tmp/sing-box /usr/local/bin/sing-box && rm -f /tmp/sing-box && /usr/local/bin/sing-box version && sudo /etc/sing-box/init-config.sh && sudo /usr/local/bin/sing-box check -c /etc/sing-box/config.json && sudo systemctl daemon-reload && sudo systemctl enable sing-box && sudo systemctl restart sing-box && sleep 2 && sudo systemctl status sing-box --no-pager"
